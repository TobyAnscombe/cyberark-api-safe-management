---
# Example: authenticate to CyberArk and manage a safe.
#
# The four Privilege Cloud built-in groups are added to every safe by default.
# Assign your Entra groups to those CyberArk groups rather than to individual safes.
#
# Run:
#   ansible-playbook examples/site.yml \
#     -e cyberark_identity_tenant=YOUR_TENANT_ID \
#     -e cyberark_subdomain=YOUR_SUBDOMAIN \
#     --vault-password-file ~/.vault_pass
#
# Vault-encrypt your secrets first:
#   ansible-vault encrypt_string 'my-client-id'     --name cyberark_client_id
#   ansible-vault encrypt_string 'my-client-secret' --name cyberark_client_secret
#
# requirements.yml (install before running):
#   roles:
#     - name: cyberark_api_authentication
#       src: https://github.com/TobyAnscombe/cyberark-api-management
#       version: main
#     - name: cyberark_safe_management
#       src: https://github.com/TobyAnscombe/cyberark-api-safe-management
#       version: main

- name: Manage CyberArk safe
  hosts: localhost
  gather_facts: false

  vars:
    cyberark_identity_tenant: "YOUR_TENANT_ID"
    cyberark_subdomain: "YOUR_SUBDOMAIN"
    # cyberark_client_id: !vault |
    #   $ANSIBLE_VAULT;1.1;AES256
    #   ...
    # cyberark_client_secret: !vault |
    #   $ANSIBLE_VAULT;1.1;AES256
    #   ...

    cyberark_safe_name: "my-application-safe"
    cyberark_safe_description: "Secrets for my-application"
    cyberark_safe_number_of_days_retention: 30
    cyberark_safe_state: present

    # cyberark_safe_standard_members and cyberark_safe_break_glass_* are not overridden
    # here — the defaults unconditionally apply the following groups to every safe:
    #   - Privilege Cloud Administrators    (administrator permissions)
    #   - Privilege Cloud Auditors          (auditor permissions)
    #   - Privilege Cloud Safe Managers     (safe manager permissions)
    #   - Privilege Cloud Access Approvers  (approver permissions)
    #   - Privilege Cloud Break Glass Access (full permissions, never purged)
    #
    # Add Entra groups to the corresponding CyberArk groups rather than to individual safes.
    #
    # For per-safe custom access (e.g. a service account), use cyberark_safe_members:
    # cyberark_safe_members:
    #   - name: svc_myapp
    #     member_type: User
    #     permissions:
    #       useAccounts: true
    #       retrieveAccounts: true
    #       listAccounts: true
    #       viewSafeMembers: true

    # Break glass — emergency access that bypasses dual-control workflows.
    # This member is never removed by purge logic.
    # cyberark_safe_break_glass_enabled: true          # on by default
    # cyberark_safe_break_glass_member: "Privilege Cloud Break Glass Access"  # default
    # cyberark_safe_break_glass_member_type: "Group"   # default

  roles:
    - cyberark_api_authentication
    - cyberark_safe_management

  tasks:
    - name: Show safe detail
      debug:
        var: cyberark_safe_detail
