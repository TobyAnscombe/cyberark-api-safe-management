---
galaxy_info:
  author: TobyAnscombe
  namespace: tobyanscombe
  role_name: cyberark_safe_management
  description: >-
    Idempotently creates, updates, or deletes a CyberArk Privilege Cloud safe
    and manages its members via the REST API
  license: MIT
  min_ansible_version: "2.14"
  platforms:
    - name: EL
      versions: ["8", "9"]
    - name: Ubuntu
      versions: [bionic, focal, jammy, noble]
    - name: Debian
      versions: [bullseye, bookworm]

# cyberark_token must be present on the play before this role runs.
# Enforced by the assert in tasks/main.yml, not by a hard role dependency, so
# callers may supply it via cyberark_api_authentication or by another means.
