---
- name: Validate required safe management variables
  assert:
    that:
      - cyberark_token is defined
      - cyberark_token | trim | length > 0
      - cyberark_subdomain | trim | length > 0
      - cyberark_safe_name | trim | length > 0
      - cyberark_safe_state in ['present', 'absent']
    fail_msg: >-
      cyberark_token, cyberark_subdomain, and cyberark_safe_name must all be set.
      cyberark_safe_state must be 'present' or 'absent'.
  run_once: true
  delegate_to: localhost

- name: Validate safe name length
  assert:
    that:
      - cyberark_safe_name | length <= 28
    fail_msg: >-
      cyberark_safe_name '{{ cyberark_safe_name }}' is {{ cyberark_safe_name | length }}
      characters — Privilege Cloud safe names are limited to 28 characters. The API
      rejects longer names with a generic 400 Bad Request, not a name-specific error,
      so this fails fast with a clear message instead.
  run_once: true
  delegate_to: localhost

- name: Validate break glass configuration
  assert:
    that:
      - cyberark_safe_break_glass_member | trim | length > 0
    fail_msg: "cyberark_safe_break_glass_member must be set when cyberark_safe_break_glass_enabled is true"
  when:
    - cyberark_safe_state == 'present'
    - cyberark_safe_break_glass_enabled
  run_once: true
  delegate_to: localhost

- name: Ensure safe is present
  include_tasks: safe_present.yml
  when: cyberark_safe_state == 'present'

- name: Ensure safe is absent
  include_tasks: safe_absent.yml
  when: cyberark_safe_state == 'absent'
