---
- name: Check if safe exists
  uri:
    url: "https://{{ cyberark_subdomain }}.privilegecloud.cyberark.cloud/passwordvault/api/Safes/{{ cyberark_safe_name | urlencode }}"
    method: GET
    headers:
      Authorization: "Bearer {{ cyberark_token }}"
    status_code: [200, 404]
    timeout: 30
    validate_certs: "{{ cyberark_validate_certs }}"
  register: _cyberark_safe_check
  no_log: true
  check_mode: false
  run_once: true
  delegate_to: localhost

- name: "[DRY RUN] Would delete safe {{ cyberark_safe_name }}"
  ansible.builtin.debug:
    msg: "DELETE /Safes — {{ cyberark_safe_name }} exists and would be deleted"
  when:
    - _cyberark_safe_check.status == 200
    - cyberark_dry_run | default(true) | bool
  run_once: true
  delegate_to: localhost

- name: Delete safe
  uri:
    url: "https://{{ cyberark_subdomain }}.privilegecloud.cyberark.cloud/passwordvault/api/Safes/{{ cyberark_safe_name | urlencode }}"
    method: DELETE
    headers:
      Authorization: "Bearer {{ cyberark_token }}"
    status_code: [204]
    timeout: 30
    validate_certs: "{{ cyberark_validate_certs }}"
  no_log: true
  when:
    - _cyberark_safe_check.status == 200
    - not cyberark_dry_run | default(true) | bool
  run_once: true
  delegate_to: localhost
