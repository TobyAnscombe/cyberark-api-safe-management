---
# Member permission dicts may be partial (e.g. a hand-written override that
# only sets a few keys). Normalize to the full ~22-key shape the API returns
# so later comparisons and PUT bodies never treat "unspecified" as "false".
- name: Normalize member permission dicts to full shape
  set_fact:
    _cyberark_sfws0010: "SFWS0010"
    cyberark_safe_standard_members: >-
      {%- set result = [] -%}
      {%- for m in cyberark_safe_standard_members -%}
        {%- set full_perms = cyberark_safe_member_default_permissions
            | combine(m.permissions | default(cyberark_safe_member_default_permissions)) -%}
        {%- set _ = result.append(m | combine({'permissions': full_perms})) -%}
      {%- endfor -%}
      {{ result }}
    cyberark_safe_members: >-
      {%- set result = [] -%}
      {%- for m in cyberark_safe_members -%}
        {%- set full_perms = cyberark_safe_member_default_permissions
            | combine(m.permissions | default(cyberark_safe_member_default_permissions)) -%}
        {%- set _ = result.append(m | combine({'permissions': full_perms})) -%}
      {%- endfor -%}
      {{ result }}
  run_once: true
  delegate_to: localhost

- name: Get current safe members
  uri:
    url: "https://{{ cyberark_subdomain }}.privilegecloud.cyberark.cloud/passwordvault/api/Safes/{{ cyberark_safe_name | urlencode }}/Members"
    method: GET
    headers:
      Authorization: "Bearer {{ cyberark_token }}"
    status_code: [200]
    timeout: 30
    validate_certs: "{{ cyberark_validate_certs }}"
  register: _cyberark_safe_members_current
  no_log: true
  check_mode: false
  run_once: true
  delegate_to: localhost

# Exclude built-in vault accounts (Master, Batch, etc.) and read-only memberships
# (e.g. safe creator, Identity-managed direct assignments) from reconciliation.
- name: Set reconcilable current member names
  set_fact:
    _cyberark_current_member_names: >-
      {{
        _cyberark_safe_members_current.json.value
        | selectattr('isPredefinedUser', 'equalto', false)
        | rejectattr('isReadOnly', 'equalto', true)
        | map(attribute='memberName')
        | list
      }}
  run_once: true
  delegate_to: localhost

- name: Set safe base URL for member operations
  set_fact:
    _cyberark_safe_url: >-
      https://{{ cyberark_subdomain }}.privilegecloud.cyberark.cloud/passwordvault/api/Safes/{{ cyberark_safe_name | urlencode }}
  run_once: true
  delegate_to: localhost

# Pre-compute all change sets upfront so tasks loop over exact targets only,
# and so the summary accumulation has concrete lists to work from.
- name: Compute member change sets
  set_fact:
    _cyberark_members_to_add_std: >-
      {{ cyberark_safe_standard_members | rejectattr('name', 'in', _cyberark_current_member_names) | list }}
    _cyberark_members_to_add_custom: >-
      {{ cyberark_safe_members | rejectattr('name', 'in', _cyberark_current_member_names) | list }}
    _cyberark_members_to_update_std: >-
      {%- set ns = namespace(result=[]) -%}
      {%- if cyberark_safe_members_reconcile_permissions | default(false) -%}
        {%- for m in cyberark_safe_standard_members -%}
          {%- if m.name in _cyberark_current_member_names -%}
            {%- set cur = (_cyberark_safe_members_current.json.value
                | selectattr('memberName', 'equalto', m.name)
                | list | first | default({})).permissions | default({}) -%}
            {%- if cur != m.permissions -%}
              {%- set ns.result = ns.result + [m] -%}
            {%- endif -%}
          {%- endif -%}
        {%- endfor -%}
      {%- endif -%}
      {{ ns.result }}
    _cyberark_members_to_update_custom: >-
      {%- set ns = namespace(result=[]) -%}
      {%- if cyberark_safe_members_reconcile_permissions | default(false) -%}
        {%- for m in cyberark_safe_members -%}
          {%- if m.name in _cyberark_current_member_names -%}
            {%- set cur = (_cyberark_safe_members_current.json.value
                | selectattr('memberName', 'equalto', m.name)
                | list | first | default({})).permissions | default({}) -%}
            {%- if cur != m.permissions -%}
              {%- set ns.result = ns.result + [m] -%}
            {%- endif -%}
          {%- endif -%}
        {%- endfor -%}
      {%- endif -%}
      {{ ns.result }}
    _cyberark_members_to_purge: >-
      {{
        _cyberark_current_member_names
        | difference(cyberark_safe_members | map(attribute='name') | list)
        | difference(cyberark_safe_standard_members | map(attribute='name') | list)
        | difference(
            [cyberark_safe_break_glass_member]
            if cyberark_safe_break_glass_member | trim | length > 0
            else []
          )
        | difference(cyberark_safe_purge_system_members | default([]))
        | difference(cyberark_safe_purge_exclude_members | default([]))
      }}
  run_once: true
  delegate_to: localhost

# ---------------------------------------------------------------------------
# Standard members — always reconciled first, never purged
# ---------------------------------------------------------------------------
- name: Manage standard tier members
  ansible.builtin.include_tasks: _member_tier.yml
  vars:
    _cyberark_tier: standard
    _cyberark_member_list_add: "{{ _cyberark_members_to_add_std }}"
    _cyberark_member_list_update: "{{ _cyberark_members_to_update_std }}"
    _cyberark_default_member_type: Group
    _cyberark_tier_purge_applies: false

- name: Capture standard tier add results
  set_fact:
    _cyberark_add_std_result: "{{ _cyberark_tier_add_result | default({'results': []}) }}"
    _cyberark_add_std_role_retry_result: "{{ _cyberark_tier_role_retry_result | default({'results': []}) }}"
  run_once: true
  delegate_to: localhost

# ---------------------------------------------------------------------------
# Custom members
# ---------------------------------------------------------------------------
- name: Manage custom tier members
  ansible.builtin.include_tasks: _member_tier.yml
  vars:
    _cyberark_tier: custom
    _cyberark_member_list_add: "{{ _cyberark_members_to_add_custom }}"
    _cyberark_member_list_update: "{{ _cyberark_members_to_update_custom }}"
    _cyberark_default_member_type: User
    _cyberark_tier_purge_applies: true

- name: Capture custom tier add results
  set_fact:
    _cyberark_add_custom_result: "{{ _cyberark_tier_add_result | default({'results': []}) }}"
    _cyberark_add_custom_role_retry_result: "{{ _cyberark_tier_role_retry_result | default({'results': []}) }}"
  run_once: true
  delegate_to: localhost

# ---------------------------------------------------------------------------
# Break glass member — always reconciled last, never purged, no permission diff
# ---------------------------------------------------------------------------
- name: "[DRY RUN] Would add break glass member {{ cyberark_safe_break_glass_member }}"
  ansible.builtin.debug:
    msg: "POST /Members — {{ cyberark_safe_break_glass_member }} not present and would be added"
  when:
    - cyberark_safe_break_glass_enabled
    - cyberark_safe_break_glass_member | trim | length > 0
    - cyberark_safe_break_glass_member not in _cyberark_current_member_names
    - cyberark_dry_run | default(true) | bool
  run_once: true
  delegate_to: localhost

- name: Add break glass member
  uri:
    url: "https://{{ cyberark_subdomain }}.privilegecloud.cyberark.cloud/passwordvault/api/Safes/{{ cyberark_safe_name | urlencode }}/Members"
    method: POST
    headers:
      Authorization: "Bearer {{ cyberark_token }}"
    body_format: json
    body:
      memberName: "{{ cyberark_safe_break_glass_member }}"
      memberType: "{{ cyberark_safe_break_glass_member_type }}"
      permissions: "{{ cyberark_safe_break_glass_permissions }}"
    status_code: [201]
    timeout: 30
    validate_certs: "{{ cyberark_validate_certs }}"
  no_log: true
  when:
    - cyberark_safe_break_glass_enabled
    - cyberark_safe_break_glass_member | trim | length > 0
    - cyberark_safe_break_glass_member not in _cyberark_current_member_names
    - not cyberark_dry_run | default(true) | bool
  run_once: true
  delegate_to: localhost

- name: "[DRY RUN] Would update break glass member {{ cyberark_safe_break_glass_member }}"
  ansible.builtin.debug:
    msg: "PUT /Members/{{ cyberark_safe_break_glass_member }} — permissions would be reconciled"
  when:
    - cyberark_safe_break_glass_enabled
    - cyberark_safe_break_glass_member | trim | length > 0
    - cyberark_safe_break_glass_member in _cyberark_current_member_names
    - cyberark_dry_run | default(true) | bool
  run_once: true
  delegate_to: localhost

- name: Update break glass member permissions
  uri:
    url: "{{ _cyberark_safe_url }}/Members/{{ cyberark_safe_break_glass_member | urlencode }}/"
    method: PUT
    headers:
      Authorization: "Bearer {{ cyberark_token }}"
    body_format: json
    body:
      permissions: "{{ cyberark_safe_break_glass_permissions }}"
    status_code: [200]
    timeout: 30
    validate_certs: "{{ cyberark_validate_certs }}"
  no_log: true
  when:
    - cyberark_safe_break_glass_enabled
    - cyberark_safe_break_glass_member | trim | length > 0
    - cyberark_safe_break_glass_member in _cyberark_current_member_names
    - not cyberark_dry_run | default(true) | bool
  run_once: true
  delegate_to: localhost

# ---------------------------------------------------------------------------
# Accumulate member changes into provision summary
# ---------------------------------------------------------------------------
- name: Accumulate member changes in provision summary
  set_fact:
    _cyberark_provision_summary: >-
      {%- set ns = namespace(rows=_cyberark_provision_summary | default([])) -%}
      {%- set _std_tag = {'_cyberark_tier_detail': 'standard member'} -%}
      {%- set _std_role_tag = {'_cyberark_tier_detail': 'standard member (as Role)'} -%}
      {%- set _custom_tag = {'_cyberark_tier_detail': ''} -%}
      {%- set _custom_role_tag = {'_cyberark_tier_detail': '(as Role)'} -%}
      {%- if cyberark_dry_run | default(true) | bool -%}
        {%- set _all_add_pending =
            (_cyberark_members_to_add_std | map('combine', _std_tag) | list)
            + (_cyberark_members_to_add_custom | map('combine', _custom_tag) | list) -%}
        {%- for m in _all_add_pending -%}
          {%- set ns.rows = ns.rows + [{'safe': cyberark_safe_name, 'type': 'member',
              'item': m.name, 'action': 'add', 'detail': m._cyberark_tier_detail}] -%}
        {%- endfor -%}
      {%- else -%}
        {%- set _std_results = (_cyberark_add_std_result | default({'results': []})).results | default([]) -%}
        {%- set _custom_results = (_cyberark_add_custom_result | default({'results': []})).results | default([]) -%}
        {%- set _std_role_results = (_cyberark_add_std_role_retry_result | default({'results': []})).results | default([]) -%}
        {%- set _custom_role_results = (_cyberark_add_custom_role_retry_result | default({'results': []})).results | default([]) -%}
        {%- set _all_add_results =
            (_std_results | map('combine', _std_tag) | list)
            + (_custom_results | map('combine', _custom_tag) | list) -%}
        {%- set _all_role_retry_results =
            (_std_role_results | map('combine', _std_role_tag) | list)
            + (_custom_role_results | map('combine', _custom_role_tag) | list) -%}
        {%- for r in _all_add_results -%}
          {%- if not (r.skipped | default(false)) -%}
            {%- if r.failed | default(false) -%}
              {%- if (r.json.ErrorCode | default('')) != _cyberark_sfws0010 -%}
                {%- set ns.rows = ns.rows + [{'safe': cyberark_safe_name, 'type': 'member', 'item': r.item.name,
                    'action': 'add-failed', 'detail': r.json.ErrorMessage | default('group not defined in CyberArk')}] -%}
              {%- endif -%}
            {%- else -%}
              {%- set ns.rows = ns.rows + [{'safe': cyberark_safe_name, 'type': 'member', 'item': r.item.name,
                  'action': 'add', 'detail': r._cyberark_tier_detail}] -%}
            {%- endif -%}
          {%- endif -%}
        {%- endfor -%}
        {%- for r in _all_role_retry_results -%}
          {%- if not (r.skipped | default(false)) -%}
            {%- if r.failed | default(false) -%}
              {%- set ns.rows = ns.rows + [{'safe': cyberark_safe_name, 'type': 'member', 'item': r.item.name,
                  'action': 'add-failed', 'detail': r.json.ErrorMessage | default('not found as vault Group or Identity Role')}] -%}
            {%- else -%}
              {%- set ns.rows = ns.rows + [{'safe': cyberark_safe_name, 'type': 'member', 'item': r.item.name,
                  'action': 'add', 'detail': r._cyberark_tier_detail}] -%}
            {%- endif -%}
          {%- endif -%}
        {%- endfor -%}
      {%- endif -%}
      {%- for m in _cyberark_members_to_update_std + _cyberark_members_to_update_custom -%}
        {%- set cur = (_cyberark_safe_members_current.json.value
            | selectattr('memberName', 'equalto', m.name)
            | list | first | default({})).permissions | default({}) -%}
        {%- set ns2 = namespace(changes=[]) -%}
        {%- for key, val in m.permissions.items() -%}
          {%- if cur.get(key) != val -%}
            {%- set ns2.changes = ns2.changes + [key ~ ': ' ~ cur.get(key) | string ~ ' → ' ~ val | string] -%}
          {%- endif -%}
        {%- endfor -%}
        {%- set _detail = ns2.changes | join(' | ') -%}
        {%- set ns.rows = ns.rows + [{'safe': cyberark_safe_name, 'type': 'member',
            'item': m.name, 'action': 'perm-update', 'detail': _detail}] -%}
      {%- endfor -%}
      {%- for name in (_cyberark_members_to_purge if cyberark_safe_members_purge else []) -%}
        {%- set ns.rows = ns.rows + [{'safe': cyberark_safe_name, 'type': 'member', 'item': name, 'action': 'remove', 'detail': ''}] -%}
      {%- endfor -%}
      {%- if cyberark_safe_break_glass_enabled
             and cyberark_safe_break_glass_member | trim | length > 0
             and cyberark_safe_break_glass_member not in _cyberark_current_member_names -%}
        {%- set ns.rows = ns.rows + [{'safe': cyberark_safe_name, 'type': 'member', 'item': cyberark_safe_break_glass_member,
        'action': 'add', 'detail': 'break glass'}] -%}
      {%- endif -%}
      {{ ns.rows }}
  run_once: true
  delegate_to: localhost
