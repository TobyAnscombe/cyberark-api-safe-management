---
- name: Check if safe exists
  uri:
    url: "https://{{ cyberark_subdomain }}.privilegecloud.cyberark.cloud/passwordvault/api/Safes/{{ cyberark_safe_name | urlencode }}"
    method: GET
    headers:
      Authorization: "Bearer {{ cyberark_token }}"
    status_code: [200, 404]
    timeout: 30
    validate_certs: "{{ cyberark_validate_certs }}"
  register: _cyberark_safe_check
  run_once: true
  delegate_to: localhost

- name: "[DRY RUN] Would create safe {{ cyberark_safe_name }}"
  ansible.builtin.debug:
    msg: "POST /Safes — {{ cyberark_safe_name }} does not exist and would be created"
  when:
    - _cyberark_safe_check.status == 404
    - cyberark_dry_run | default(true)
  run_once: true
  delegate_to: localhost

- name: Create safe
  uri:
    url: "https://{{ cyberark_subdomain }}.privilegecloud.cyberark.cloud/passwordvault/api/Safes"
    method: POST
    headers:
      Authorization: "Bearer {{ cyberark_token }}"
    body_format: json
    body: >-
      {{
        {
          'safeName': cyberark_safe_name,
          'description': cyberark_safe_description,
          'location': cyberark_safe_location,
          'numberOfDaysRetention': cyberark_safe_number_of_days_retention,
          'numberOfVersionsRetention': cyberark_safe_number_of_versions_retention,
          'autoPurgeEnabled': cyberark_safe_auto_purge_enabled,
          'olacEnabled': cyberark_safe_olac_enabled
        } | combine(
          {'managingCPM': cyberark_safe_managing_cpm}
          if cyberark_safe_managing_cpm | trim | length > 0
          else {}
        )
      }}
    status_code: [201]
    timeout: 30
    validate_certs: "{{ cyberark_validate_certs }}"
  register: _cyberark_safe_create
  when:
    - _cyberark_safe_check.status == 404
    - not cyberark_dry_run | default(true)
  run_once: true
  delegate_to: localhost

- name: "[DRY RUN] Would update safe {{ cyberark_safe_name }}"
  ansible.builtin.debug:
    msg: "PUT /Safes/{{ cyberark_safe_name }} — safe exists and would be updated"
  when:
    - _cyberark_safe_check.status == 200
    - cyberark_dry_run | default(true)
  run_once: true
  delegate_to: localhost

- name: Update safe
  uri:
    url: "https://{{ cyberark_subdomain }}.privilegecloud.cyberark.cloud/passwordvault/api/Safes/{{ cyberark_safe_name | urlencode }}"
    method: PUT
    headers:
      Authorization: "Bearer {{ cyberark_token }}"
    body_format: json
    body: >-
      {{
        {
          'safeName': cyberark_safe_name,
          'description': cyberark_safe_description,
          'location': cyberark_safe_location,
          'numberOfDaysRetention': cyberark_safe_number_of_days_retention,
          'numberOfVersionsRetention': cyberark_safe_number_of_versions_retention,
          'autoPurgeEnabled': cyberark_safe_auto_purge_enabled,
          'olacEnabled': cyberark_safe_olac_enabled
        } | combine(
          {'managingCPM': cyberark_safe_managing_cpm}
          if cyberark_safe_managing_cpm | trim | length > 0
          else {}
        )
      }}
    status_code: [200]
    timeout: 30
    validate_certs: "{{ cyberark_validate_certs }}"
  register: _cyberark_safe_update
  when:
    - _cyberark_safe_check.status == 200
    - not cyberark_dry_run | default(true)
  run_once: true
  delegate_to: localhost

- name: Expose created safe as fact
  set_fact:
    cyberark_safe_detail: "{{ _cyberark_safe_create.json }}"
  when:
    - _cyberark_safe_check.status == 404
    - not cyberark_dry_run | default(true)
  run_once: true
  delegate_to: localhost

- name: Expose updated safe as fact
  set_fact:
    cyberark_safe_detail: "{{ _cyberark_safe_update.json }}"
  when:
    - _cyberark_safe_check.status == 200
    - not cyberark_dry_run | default(true)
  run_once: true
  delegate_to: localhost

- name: Manage safe members
  include_tasks: safe_members.yml
  when: >-
    cyberark_safe_standard_members | length > 0
    or cyberark_safe_members | length > 0
    or cyberark_safe_members_purge
    or (cyberark_safe_break_glass_enabled and cyberark_safe_break_glass_member | trim | length > 0)
